name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: youthlink
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youthlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youthlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/extensions.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/018_track_float_embedding_format.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/019_add_pipeline_operations.sql
      - run: python etl/apply_migrations.py --baseline-through 019_add_pipeline_operations.sql
      - run: python etl/apply_migrations.py --status
